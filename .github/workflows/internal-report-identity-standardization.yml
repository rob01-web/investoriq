name: InvestorIQ Internal Report Identity Standardization

on:
  push:
    branches:
      - internal-final-surgical-polish-20260825

permissions:
  contents: write

jobs:
  standardize-report-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply identity surface alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_if_present(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, new)
                  p.write_text(text, encoding='utf-8')

          replace_if_present(
              'api/_lib/acquisition-memo-v2-document.js',
              '<div class="cover-prop-sub">Investment Committee Memorandum</div>',
              '<div class="cover-prop-sub">${escapeHtml(UNDERWRITING_REPORT_IDENTITY.canonicalTitle)}</div>'
          )

          replace_if_present(
              'tests/qa/full-underwriting-elite10b1-cover-system-smoke.js',
              'assert.match(coverFunction, /class="cover-prop-sub">Investment Committee Memorandum</i);',
              'assert.match(coverFunction, /class="cover-prop-sub">\\$\\{escapeHtml\\(UNDERWRITING_REPORT_IDENTITY\\.canonicalTitle\\)\\}/i);'
          )
          replace_if_present(
              'tests/qa/full-underwriting-elite10b2-committee-opening-system-smoke.js',
              'assert.match(coverFunction, /class="cover-prop-sub">Investment Committee Memorandum/);',
              'assert.match(coverFunction, /class="cover-prop-sub">\\$\\{escapeHtml\\(UNDERWRITING_REPORT_IDENTITY\\.canonicalTitle\\)\\}/);'
          )
          replace_if_present(
              'tests/qa/acquisition-memo-v2-boss-contract-render-smoke.js',
              'assert.match(finalHtml, /Investment Committee Memorandum/i);',
              'assert.match(finalHtml, /Underwriting Report/i);'
          )

          for file_name in [
              'tests/qa/p0b-deterministic-contract-qa-seal-smoke.js',
              'tests/qa/p0c-final-pdf-publication-quality-boss-smoke.js',
              'tests/qa/h16-h17-manifest-pdf-certification-controlled-replay-smoke.js',
          ]:
              p = Path(file_name)
              text = p.read_text(encoding='utf-8')
              text = text.replace('InvestorIQ Preliminary Investment Screening Memorandum', 'InvestorIQ Screening Report')
              text = text.replace('Preliminary Investment Screening Memorandum', 'Screening Report')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Run focused identity proof without failure email
        id: proof
        shell: bash
        run: |
          set +e
          status=0
          for test in \
            tests/qa/retest34-report-identity-authority-regression-smoke.js \
            tests/qa/p0b-deterministic-contract-qa-seal-smoke.js \
            tests/qa/p0c-final-pdf-publication-quality-boss-smoke.js \
            tests/qa/h16-h17-manifest-pdf-certification-controlled-replay-smoke.js \
            tests/qa/full-underwriting-elite10b1-cover-system-smoke.js \
            tests/qa/full-underwriting-elite10b2-committee-opening-system-smoke.js \
            tests/qa/acquisition-memo-v2-boss-contract-render-smoke.js \
            tests/qa/acquisition-memo-v2-document-smoke.js \
            tests/qa/acquisition-memo-v2-final-pdf-handoff-smoke.js
          do
            echo "=== $test ==="
            node "$test"
            code=$?
            if [ $code -ne 0 ]; then
              echo "IDENTITY_PROOF_FAILURE: $test ($code)"
              status=1
            fi
          done

          echo "=== CURRENT IDENTITY LITERALS ==="
          grep -n 'canonicalTitle\|fullTitle\|requiredPdfTextAnchors' api/_lib/report-identity-authority.js || true
          echo "=== STALE FULL SCREENING TITLE OUTSIDE ARCHIVE ==="
          grep -RIn --include='*.js' 'InvestorIQ Preliminary Investment Screening Memorandum' api tests/qa || true
          echo "=== HARDCODED COMMITTEE MEMO DOCUMENT TITLE ==="
          grep -RIn --include='*.js' 'Investment Committee Memorandum' api/_lib/acquisition-memo-v2-document.js tests/qa/full-underwriting-elite10b1-cover-system-smoke.js tests/qa/full-underwriting-elite10b2-committee-opening-system-smoke.js tests/qa/acquisition-memo-v2-boss-contract-render-smoke.js || true

          echo "proof_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit only when focused proof is clean
        if: steps.proof.outputs.proof_status == '0'
        shell: bash
        run: |
          if git diff --quiet -- api tests/qa; then
            echo "No identity surface diff remains."
            exit 0
          fi
          git config user.name "rob01-web"
          git config user.email "robmccallum01@gmail.com"
          git add -- api/_lib/acquisition-memo-v2-document.js tests/qa/full-underwriting-elite10b1-cover-system-smoke.js tests/qa/full-underwriting-elite10b2-committee-opening-system-smoke.js tests/qa/acquisition-memo-v2-boss-contract-render-smoke.js tests/qa/p0b-deterministic-contract-qa-seal-smoke.js tests/qa/p0c-final-pdf-publication-quality-boss-smoke.js tests/qa/h16-h17-manifest-pdf-certification-controlled-replay-smoke.js
          git commit -m "align customer surfaces with Screening and Underwriting report identities"
          git push origin HEAD:internal-final-surgical-polish-20260825
