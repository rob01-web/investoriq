name: InvestorIQ Worker Kick

on:
  # Automatic scheduling authority is Supabase Cron / pg_net.
  # This workflow is manual emergency fallback only.
  workflow_dispatch: {}

concurrency:
  group: worker-kick
  cancel-in-progress: false

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call canonical InvestorIQ worker
        run: |
          curl --fail-with-body --connect-timeout 15 --max-time 330 -sS \
            -X POST "https://investoriq.tech/api/admin-run-worker" \
            -H "x-admin-run-key: ${{ secrets.ADMIN_RUN_KEY }}" \
            -H "Content-Type: application/json" \
            --data "{}"
