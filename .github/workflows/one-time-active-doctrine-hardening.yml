name: One-time Active Doctrine Hardening

on:
  push:
    branches:
      - internal-underwriting-editorial-analytical-elite-20260906-r1
    paths:
      - '.github/workflows/one-time-active-doctrine-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: internal-underwriting-editorial-analytical-elite-20260906-r1
          fetch-depth: 0

      - name: Apply active doctrine clarification
        run: python scripts/one-time-active-doctrine-hardening.py

      - name: Verify bounded doctrine diff
        run: |
          git diff --check
          git diff -- docs/INVESTORIQ_PRODUCT_DOCTRINE.md docs/PRODUCTION_PIPELINE_ARCHITECTURE.md

      - name: Commit active doctrine hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INVESTORIQ_PRODUCT_DOCTRINE.md docs/PRODUCTION_PIPELINE_ARCHITECTURE.md
          git commit -m "Harden active admission doctrine authority"
          git push origin HEAD:internal-underwriting-editorial-analytical-elite-20260906-r1
