name: InvestorIQ Surgical AI Architecture Release

on:
  push:
    branches:
      - production-ai-architecture-20260910-r1
    paths:
      - '.github/workflows/production-ai-architecture-release.yml'

permissions:
  contents: write

jobs:
  certify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact production release branch
        uses: actions/checkout@v4
        with:
          ref: production-ai-architecture-20260910-r1
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import only certified AI runtime delta
        run: |
          git fetch origin internal-ai-model-architecture-20260910-r1
          git checkout b9efe1edca3ea8247cb2739516dbab2ac9458bfe -- \
            api/_lib/qa-review.js \
            api/_lib/source-package-qa.js \
            api/_lib/qa-manager-review.js \
            lib/ai-model-architecture.js \
            lib/ai-t12-recovery.js \
            lib/ai-rent-roll-recovery.js \
            lib/ai-support-doc-recovery.js \
            tests/qa/ai-model-architecture-smoke.js

      - name: Syntax and architecture checks
        run: |
          node --check lib/ai-model-architecture.js
          node --check lib/ai-t12-recovery.js
          node --check lib/ai-rent-roll-recovery.js
          node --check lib/ai-support-doc-recovery.js
          node --check api/_lib/qa-review.js
          node --check api/_lib/source-package-qa.js
          node --check api/_lib/qa-manager-review.js
          node tests/qa/ai-model-architecture-smoke.js

      - name: Targeted AI regression checks
        run: |
          node tests/qa/qa-manager-review-smoke.js
          node tests/qa/qa-doctrine-smoke.js
          node tests/qa/supporting-doc-recovery-smoke.js

      - name: Canonical launch QA
        run: npm run qa

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Commit exact certified production delta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api/_lib/qa-review.js \
            api/_lib/source-package-qa.js \
            api/_lib/qa-manager-review.js \
            lib/ai-model-architecture.js \
            lib/ai-t12-recovery.js \
            lib/ai-rent-roll-recovery.js \
            lib/ai-support-doc-recovery.js \
            tests/qa/ai-model-architecture-smoke.js
          if git diff --cached --quiet; then
            echo 'No runtime release changes required.'
            exit 0
          fi
          git commit -m 'Release evidence-locked AI architecture [skip ci]'
          git push origin HEAD:production-ai-architecture-20260910-r1
