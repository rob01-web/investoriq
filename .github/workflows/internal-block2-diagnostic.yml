name: InvestorIQ Internal Block 2 Identity Discovery

on:
  push:
    branches:
      - internal-final-surgical-polish-20260825

permissions:
  contents: read

jobs:
  block2-identity-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect current underwriting identity literals
        shell: bash
        run: |
          echo "=== PRODUCTION UNDERWRITING REPORT LITERALS ==="
          grep -RIn --include='*.js' --include='*.html' 'Underwriting Report' api || true
          echo
          echo "=== CURRENT QA UNDERWRITING REPORT LITERALS ==="
          grep -RIn --include='*.js' 'Underwriting Report' tests/qa || true
          echo
          echo "=== INVESTMENT COMMITTEE MEMORANDUM LITERALS ==="
          grep -RIn --include='*.js' --include='*.html' 'Investment Committee Memorandum' api tests/qa || true
