name: One-time DocRaptor Professional Economics Baseline

on:
  push:
    branches:
      - internal-owner-economics-cost-model-20260909-r2

permissions:
  contents: write

jobs:
  apply-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: internal-owner-economics-cost-model-20260909-r2
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply owner-approved DocRaptor Professional baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            Path('src/lib/ownerEconomics.js'): [
              ('  docraptorMonthlyCost: 15,', '  docraptorMonthlyCost: 29,'),
            ],
            Path('src/components/Admin/OwnerEconomicsPanel.jsx'): [
              ('helper="Launch baseline: Basic $15/month for 125 documents"', 'helper="Launch baseline: Professional $29/month for 325 documents"'),
              ('DocRaptor Basic $15/month', 'DocRaptor Professional $29/month'),
            ],
            Path('tests/qa/owner-economics-smoke.js'): [
              ('assert.ok(Math.abs(empty.fixedMonthlyCosts - 68.33) < 1e-9);', 'assert.ok(Math.abs(empty.fixedMonthlyCosts - 82.33) < 1e-9);'),
            ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Verify bounded diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'src/components/Admin/OwnerEconomicsPanel.jsx\nsrc/lib/ownerEconomics.js\ntests/qa/owner-economics-smoke.js'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Run economics smoke
        run: node tests/qa/owner-economics-smoke.js

      - name: Run canonical QA
        run: npm run qa

      - name: Build production bundle
        run: npm run build

      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Admin/OwnerEconomicsPanel.jsx src/lib/ownerEconomics.js tests/qa/owner-economics-smoke.js
          git commit -m "Use DocRaptor Professional as launch planning baseline"
          git push origin HEAD:internal-owner-economics-cost-model-20260909-r2
