name: Launch E2E Contract Reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - hotfix-launch-e2e-20260910-r1
    paths:
      - scripts/apply-launch-e2e-hotfix.js
      - tests/qa/launch-e2e-contract-reconciliation-smoke.js
      - tests/qa/launch-readiness-customer-journey-smoke.js
      - tests/qa/dashboard-direct-query-cutover-smoke.js
      - tests/qa/run-all.js
      - .github/workflows/launch-e2e-contract-reconciliation.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix-launch-e2e-20260910-r1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate bounded launch hotfix
        run: node scripts/apply-launch-e2e-hotfix.js

      - name: Launch E2E contract regression guard
        run: node tests/qa/launch-e2e-contract-reconciliation-smoke.js

      - name: Canonical launch QA
        id: canonical_qa
        continue-on-error: true
        run: npm run qa

      - name: Diagnose canonical QA runtime guard
        if: steps.canonical_qa.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "--- git status ---"
          git status --short
          echo "--- dashboard/direct-query test files after qa ---"
          find tests/qa -maxdepth 1 -type f \( -iname '*dashboard*' -o -iname '*phase5*' \) -print | sort
          echo "--- exact assertion origin after qa ---"
          grep -RFn --exclude-dir=node_modules "Dashboard must keep direct analysis_jobs reads removed" . || true
          echo "--- exact npm script origin after qa ---"
          grep -RFn --exclude-dir=node_modules "qa:component:dashboard-cutover-direct-query" . || true
          echo "--- child-process/npm invocation references in launch tests ---"
          grep -RFn --exclude-dir=node_modules -E "spawnSync|execSync|npm run qa:component:dashboard-cutover-direct-query|dashboard-direct-query-cutover-smoke" tests scripts package.json || true
          echo "--- canonical package qa scripts after qa ---"
          node -e "const p=require('./package.json'); console.log(JSON.stringify(Object.fromEntries(Object.entries(p.scripts||{}).filter(([k])=>k==='qa'||k.includes('dashboard')||k.includes('phase5'))),null,2))"

      - name: Enforce canonical launch QA result
        if: steps.canonical_qa.outcome == 'failure'
        run: exit 1

      - name: Production build
        if: steps.canonical_qa.outcome == 'success'
        run: npm run build

      - name: Diff integrity and allowlist
        if: steps.canonical_qa.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git ls-files --modified --others --exclude-standard | sort -u)
          printf '%s\n' "${changed[@]}"
          expected=(
            "src/pages/Dashboard.jsx"
            "supabase/migrations/20260910193000_launch_e2e_contract_reconciliation.sql"
          )
          if [[ "${#changed[@]}" -ne "${#expected[@]}" ]]; then
            echo "Unexpected number of generated files"
            exit 1
          fi
          for i in "${!expected[@]}"; do
            if [[ "${changed[$i]}" != "${expected[$i]}" ]]; then
              echo "Unexpected generated file: ${changed[$i]}"
              exit 1
            fi
          done

      - name: Commit certified hotfix
        if: steps.canonical_qa.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx supabase/migrations/20260910193000_launch_e2e_contract_reconciliation.sql
          if git diff --cached --quiet; then
            echo "No generated hotfix changes to commit"
            exit 1
          fi
          git commit -m "Repair launch E2E production contracts [skip ci]"
          git push origin HEAD:hotfix-launch-e2e-20260910-r1
