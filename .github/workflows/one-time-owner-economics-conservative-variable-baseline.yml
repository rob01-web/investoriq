name: One-time Owner Economics Conservative Variable Baseline

on:
  push:
    branches:
      - internal-owner-economics-cost-model-20260909-r2

permissions:
  contents: write

jobs:
  apply-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: internal-owner-economics-cost-model-20260909-r2
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply owner-approved conservative variable baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            Path('src/lib/ownerEconomics.js'): [
              ('  screeningAiCost: 0,', '  screeningAiCost: 1,'),
              ('  underwritingAiCost: 0,', '  underwritingAiCost: 2,'),
              ('  screeningTextractPages: 0,', '  screeningTextractPages: 34,'),
              ('  underwritingTextractPages: 0,', '  underwritingTextractPages: 100,'),
            ],
            Path('src/components/Admin/OwnerEconomicsPanel.jsx'): [
              ('helper="Enter observed OpenAI cost from one controlled Screening generation"', 'helper="Conservative owner-planning allowance: $1.00 per Screening report"'),
              ('helper="Enter observed OpenAI cost from one controlled Underwriting generation"', 'helper="Conservative owner-planning allowance: $2.00 per Underwriting report"'),
              ('helper="Average pages actually sent to Textract per Screening report"', 'helper="Conservative launch allowance: 34 analyzed pages, about $0.51 per Screening report"'),
              ('helper="Average pages actually sent to Textract per Underwriting report"', 'helper="Conservative launch allowance: 100 analyzed pages, $1.50 per Underwriting report"'),
              ('OpenAI defaults remain $0 until controlled report-level usage is measured.', 'OpenAI owner-planning allowances are $1 per Screening report and $2 per Underwriting report. Textract planning allowances are 34 analyzed pages per Screening report and 100 analyzed pages per Underwriting report. These are deliberately conservative planning assumptions and should be replaced with observed post-launch averages when enough production data exists.'),
            ],
            Path('tests/qa/owner-economics-smoke.js'): [
              ("const empty = deriveOwnerEconomics({ prices, assumptions: {} });\nassert.equal(empty.grossRevenue, 0);", "assert.equal(DEFAULT_OWNER_ECONOMICS_ASSUMPTIONS.screeningAiCost, 1);\nassert.equal(DEFAULT_OWNER_ECONOMICS_ASSUMPTIONS.underwritingAiCost, 2);\nassert.equal(DEFAULT_OWNER_ECONOMICS_ASSUMPTIONS.screeningTextractPages, 34);\nassert.equal(DEFAULT_OWNER_ECONOMICS_ASSUMPTIONS.underwritingTextractPages, 100);\n\nconst empty = deriveOwnerEconomics({ prices, assumptions: {} });\nassert.equal(empty.grossRevenue, 0);")
            ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Verify bounded diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'src/components/Admin/OwnerEconomicsPanel.jsx\nsrc/lib/ownerEconomics.js\ntests/qa/owner-economics-smoke.js'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Run economics smoke
        run: node tests/qa/owner-economics-smoke.js

      - name: Run canonical QA
        run: npm run qa

      - name: Build production bundle
        run: npm run build

      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Admin/OwnerEconomicsPanel.jsx src/lib/ownerEconomics.js tests/qa/owner-economics-smoke.js
          git commit -m "Lock conservative owner economics variable baseline"
          git push origin HEAD:internal-owner-economics-cost-model-20260909-r2
