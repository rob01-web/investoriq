name: One-time Owner Economics Resend Cost Field

on:
  push:
    branches:
      - internal-owner-economics-cost-model-20260909-r2

permissions:
  contents: write

jobs:
  patch-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: internal-owner-economics-cost-model-20260909-r2
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Resend cost field
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          econ_path = Path('src/lib/ownerEconomics.js')
          panel_path = Path('src/components/Admin/OwnerEconomicsPanel.jsx')
          test_path = Path('tests/qa/owner-economics-smoke.js')

          econ = econ_path.read_text()
          panel = panel_path.read_text()
          test = test_path.read_text()

          def repl(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} guard failed: {count}')
              return text.replace(old, new)

          econ = repl(econ,
              "  domainEmailMonthlyCost: 8.33,\n  otherMonthlyCost: 0,\n",
              "  domainEmailMonthlyCost: 8.33,\n  resendMonthlyCost: 0,\n  otherMonthlyCost: 0,\n",
              'defaults')
          econ = repl(econ,
              "    domainEmailMonthlyCost: finiteNonNegative(value.domainEmailMonthlyCost, DEFAULT_OWNER_ECONOMICS_ASSUMPTIONS.domainEmailMonthlyCost),\n    otherMonthlyCost: finiteNonNegative(value.otherMonthlyCost),\n",
              "    domainEmailMonthlyCost: finiteNonNegative(value.domainEmailMonthlyCost, DEFAULT_OWNER_ECONOMICS_ASSUMPTIONS.domainEmailMonthlyCost),\n    resendMonthlyCost: finiteNonNegative(value.resendMonthlyCost, DEFAULT_OWNER_ECONOMICS_ASSUMPTIONS.resendMonthlyCost),\n    otherMonthlyCost: finiteNonNegative(value.otherMonthlyCost),\n",
              'normalizer')
          econ = repl(econ,
              "    a.docraptorMonthlyCost +\n    a.domainEmailMonthlyCost +\n    a.otherMonthlyCost;\n",
              "    a.docraptorMonthlyCost +\n    a.domainEmailMonthlyCost +\n    a.resendMonthlyCost +\n    a.otherMonthlyCost;\n",
              'fixed-cost-sum')

          panel = repl(panel,
              "            <NumberField label=\"Domain + Email Monthly\" value={assumptions.domainEmailMonthlyCost} onChange={update('domainEmailMonthlyCost')} prefix=\"$\" step=\"0.01\" helper=\"Hostinger planning baseline: about $100/year normalized monthly\" />\n            <NumberField label=\"Other Monthly Costs\" value={assumptions.otherMonthlyCost} onChange={update('otherMonthlyCost')} prefix=\"$\" step=\"0.01\" />\n",
              "            <NumberField label=\"Domain + Email Monthly\" value={assumptions.domainEmailMonthlyCost} onChange={update('domainEmailMonthlyCost')} prefix=\"$\" step=\"0.01\" helper=\"Hostinger planning baseline: about $100/year normalized monthly\" />\n            <NumberField label=\"Resend Monthly\" value={assumptions.resendMonthlyCost} onChange={update('resendMonthlyCost')} prefix=\"$\" step=\"0.01\" helper=\"Report-ready email provider. Current launch baseline: $0\" />\n            <NumberField label=\"Other Monthly Costs\" value={assumptions.otherMonthlyCost} onChange={update('otherMonthlyCost')} prefix=\"$\" step=\"0.01\" />\n",
              'panel-field')
          panel = repl(panel,
              "Launch baseline as of September 9, 2026: Vercel Pro $20/month, Supabase Pro $25/month, DocRaptor Basic $15/month, Hostinger domain and email about $100/year, Amazon Textract AnalyzeDocument TABLES $0.015 per analyzed page, and Stripe base card processing 2.9% + US$0.30 for a USD-presented charge. AWS promotional credits are intentionally excluded. OpenAI defaults remain $0 until controlled report-level usage is measured.",
              "Launch baseline as of September 9, 2026: Vercel Pro $20/month, Supabase Pro $25/month, DocRaptor Basic $15/month, Hostinger domain and email about $100/year, Resend $0/month at current launch volume, Amazon Textract AnalyzeDocument TABLES $0.015 per analyzed page, and Stripe base card processing 2.9% + US$0.30 for a USD-presented charge. AWS promotional credits are intentionally excluded. OpenAI defaults remain $0 until controlled report-level usage is measured.",
              'launch-note')
          panel = repl(panel,
              "sub=\"Vercel + Supabase + DocRaptor + domain/email + other\"",
              "sub=\"Vercel + Supabase + DocRaptor + domain/email + Resend + other\"",
              'fixed-cost-sub')

          test = repl(test,
              "    domainEmailMonthlyCost: 8.33,\n    otherMonthlyCost: 10,\n",
              "    domainEmailMonthlyCost: 8.33,\n    resendMonthlyCost: 4,\n    otherMonthlyCost: 10,\n",
              'test-assumption')
          test = repl(test,
              "assert.ok(Math.abs(scenario.fixedMonthlyCosts - 78.33) < 1e-9);\n",
              "assert.ok(Math.abs(scenario.fixedMonthlyCosts - 82.33) < 1e-9);\n",
              'test-fixed-cost')
          test = repl(test,
              "assert.ok(Math.abs(scenario.netMonthlyContribution - 2078.364) < 1e-9);\n",
              "assert.ok(Math.abs(scenario.netMonthlyContribution - 2074.364) < 1e-9);\n",
              'test-net')
          test = repl(test,
              "assert.ok(Math.abs(scenario.annualizedNetContribution - 24940.368) < 1e-9);\n",
              "assert.ok(Math.abs(scenario.annualizedNetContribution - 24892.368) < 1e-9);\n",
              'test-annual-net')
          test = repl(test,
              "assert.ok(Math.abs(scenario.netMonthlyContributionCad - 2909.7096) < 1e-9);\n",
              "assert.ok(Math.abs(scenario.netMonthlyContributionCad - 2904.1096) < 1e-9);\n",
              'test-cad-net')

          econ_path.write_text(econ)
          panel_path.write_text(panel)
          test_path.write_text(test)
          PY

      - name: Verify bounded diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'src/components/Admin/OwnerEconomicsPanel.jsx\nsrc/lib/ownerEconomics.js\ntests/qa/owner-economics-smoke.js'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Run owner economics smoke
        run: node tests/qa/owner-economics-smoke.js

      - name: Run canonical launch QA
        run: npm run qa

      - name: Build production bundle
        run: npm run build

      - name: Commit Resend cost field
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Admin/OwnerEconomicsPanel.jsx src/lib/ownerEconomics.js tests/qa/owner-economics-smoke.js
          git commit -m "Track Resend explicitly in owner economics"
          git push origin HEAD:internal-owner-economics-cost-model-20260909-r2
