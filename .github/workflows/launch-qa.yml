name: InvestorIQ Launch QA

on:
  push:
    branches:
      - main
      - launch-certification-20260913
    paths:
      - 'api/**'
      - 'lib/**'
      - 'src/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/launch-qa.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: investoriq-launch-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install native canvas build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Run canonical launch QA
        run: npm run qa

      - name: Build production bundle
        run: npm run build

      - name: Verify certification did not mutate source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
