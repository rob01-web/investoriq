name: One-time Strict Admission UI Repair

on:
  push:
    branches:
      - internal-underwriting-editorial-analytical-elite-20260906-r1
    paths:
      - '.github/workflows/one-time-strict-admission-ui-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: internal-underwriting-editorial-analytical-elite-20260906-r1
          fetch-depth: 0

      - name: Apply exact strict-admission replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}; found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Safe customer RPC error boundary.
          replace_once(
              'src/lib/customerBoundarySupabase.js',
              "    raw.includes('AT LEAST ONE SUPPORTING DOCUMENT IS REQUIRED FOR UNDERWRITING')\n",
              "    raw.includes('AT LEAST ONE SUPPORTING DOCUMENT IS REQUIRED FOR UNDERWRITING') ||\n"
              "    raw.includes('MISSING_REQUIRED_SUPPORTING_DOCUMENT') ||\n"
              "    raw.includes('SCREENING_SUPPORTING_DOCUMENTS_NOT_ALLOWED')\n",
          )
          replace_once(
              'src/lib/customerBoundarySupabase.js',
              "    return { message: 'Upload a Rent Roll or a T12 before starting analysis.', code: 'MISSING_REQUIRED_CORE_DOCUMENTS' };",
              "    return { message: 'Upload both a Rent Roll and a T12 before starting analysis.', code: 'MISSING_REQUIRED_CORE_DOCUMENTS' };",
          )
          replace_once(
              'src/lib/customerBoundarySupabase.js',
              "  if (raw.includes('PURCHASE_NOT_AVAILABLE')) {\n",
              "  if (raw.includes('MISSING_REQUIRED_SUPPORTING_DOCUMENT') || raw.includes('AT LEAST ONE SUPPORTING DOCUMENT IS REQUIRED FOR UNDERWRITING')) {\n"
              "    return { message: 'Upload at least one supporting due diligence document before starting Underwriting.', code: 'MISSING_REQUIRED_SUPPORTING_DOCUMENT' };\n"
              "  }\n"
              "  if (raw.includes('SCREENING_SUPPORTING_DOCUMENTS_NOT_ALLOWED')) {\n"
              "    return { message: 'Screening accepts only a Rent Roll and a T12. Remove supporting documents to continue.', code: 'SCREENING_SUPPORTING_DOCUMENTS_NOT_ALLOWED' };\n"
              "  }\n"
              "  if (raw.includes('PURCHASE_NOT_AVAILABLE')) {\n",
          )

          # Pricing doctrine and premium sales copy.
          replace_once(
              'src/pages/Pricing.jsx',
              "      'Start with a Rent Roll or T12',",
              "      'Requires both a Rent Roll and T12; no additional documents accepted',",
          )
          replace_once(
              'src/pages/Pricing.jsx',
              "      'Start with a Rent Roll or T12; add supporting diligence when available',",
              "      'Requires both a Rent Roll and T12 plus at least one supporting document',",
          )
          replace_once(
              'src/pages/Pricing.jsx',
              "              Start with a Rent Roll or T12. Provide both when available, and add supporting deal documents to deepen the analysis where the evidence supports it.",
              "              Screening requires both a Rent Roll and T12. Underwriting requires both core documents plus at least one supporting due diligence document.",
          )
          replace_once(
              'src/pages/Pricing.jsx',
              "                      { label: 'Rent Roll or T12 accepted as core input',               screening: true,  underwriting: true  },\n"
              "                      { label: 'Both core sources analyzed when provided',               screening: true,  underwriting: true  },\n"
              "                      { label: 'Supporting due diligence incorporated when relevant',    screening: false, underwriting: true  },",
              "                      { label: 'Both Rent Roll and T12 required',                         screening: true,  underwriting: true  },\n"
              "                      { label: 'Additional supporting documents accepted',                screening: false, underwriting: true  },\n"
              "                      { label: 'At least one supporting document required',               screening: false, underwriting: true  },",
          )

          # Dashboard strict intake, upload UX, and product-switch safety.
          replace_once(
              'src/pages/Dashboard.jsx',
              "                    onClick={() => {\n"
              "                      setSelectedReportType(type);\n"
              "                      setSelectedPurchaseType(type);\n"
              "                    }}",
              "                    onClick={() => {\n"
              "                      setSelectedReportType(type);\n"
              "                      setSelectedPurchaseType(type);\n"
              "                      if (type === 'screening') {\n"
              "                        setUploadedFiles((prev) => prev.filter((item) => {\n"
              "                          const normalized = normalizeDashboardDocType(item.docType);\n"
              "                          return normalized === 'rent_roll' || normalized === 't12' || normalized === 't12_or_operating_statement';\n"
              "                        }));\n"
              "                      }\n"
              "                    }}",
          )
          replace_once(
              'src/pages/Dashboard.jsx',
              "                <span style={{ ...bodySmall, fontSize:12 }}>T12 + Rent Roll + supporting due diligence documents</span>",
              "                <span style={{ ...bodySmall, fontSize:12 }}>T12 + Rent Roll + at least 1 supporting document</span>",
          )
          replace_once(
              'src/pages/Dashboard.jsx',
              "                  <span style={{ ...bodySmall, fontSize:12 }}>1 Full Underwriting report</span>",
              "                  <span style={{ ...bodySmall, fontSize:12 }}>1 Underwriting report</span>",
          )
          replace_once(
              'src/pages/Dashboard.jsx',
              "            <span style={stepSub}>Enter the property name and upload at least one core document. Supporting documents are optional.</span>",
              "            <span style={stepSub}>\n"
              "              {selectedReportType === 'screening'\n"
              "                ? 'Enter the property name and upload both required core documents. Screening accepts only the Rent Roll and T12.'\n"
              "                : 'Enter the property name, upload both required core documents, and add at least one supporting due diligence document.'}\n"
              "            </span>",
          )
          replace_once(
              'src/pages/Dashboard.jsx',
              "                  <div style={{ ...bodySmall, fontSize:11, marginBottom:8, color:T.ink4 }}>Upload a Rent Roll or a T12 to unlock supporting documents.</div>",
              "                  <div style={{ ...bodySmall, fontSize:11, marginBottom:8, color:T.ink4 }}>Upload both a Rent Roll and a T12 to unlock supporting documents.</div>",
          )
          replace_once(
              'src/pages/Dashboard.jsx',
              "                      <div style={{ ...bodySmall, fontSize:11 }}>Mortgage statements, loan terms, appraisals, tax bills, or other supporting documents.</div>",
              "                      <div style={{ ...bodySmall, fontSize:11 }}>At least one supporting document is required for Underwriting. Mortgage statements, loan terms, appraisals, tax bills, or other supporting documents may be provided.</div>",
          )
          replace_once(
              'src/pages/Dashboard.jsx',
              "                    { label:'Rent Roll', val: hasRentRoll ? 'Present' : (hasT12 ? 'Optional' : 'Missing'), ok: hasRentRoll || hasT12, required: !hasT12 },\n"
              "                    { label:'T12 (Operating Statement)', val: hasT12 ? 'Present' : (hasRentRoll ? 'Optional' : 'Missing'), ok: hasRentRoll || hasT12, required: !hasRentRoll },\n"
              "                    {\n"
              "                      label:'Supporting Docs',\n"
              "                      val: hasUnderwritingSupportDocs ? 'Present' : 'Optional',\n"
              "                      ok: true,\n"
              "                      required: false,\n"
              "                    },",
              "                    { label:'Rent Roll', val: hasRentRoll ? 'Present' : 'Missing', ok: hasRentRoll, required: true },\n"
              "                    { label:'T12 (Operating Statement)', val: hasT12 ? 'Present' : 'Missing', ok: hasT12, required: true },\n"
              "                    {\n"
              "                      label:'Supporting Docs',\n"
              "                      val: hasUnderwritingSupportDocs ? 'Present' : 'Missing',\n"
              "                      ok: hasUnderwritingSupportDocs,\n"
              "                      required: true,\n"
              "                    },",
          )

          dashboard = Path('src/pages/Dashboard.jsx')
          text = dashboard.read_text(encoding='utf-8')
          old_fallback = "reportUploadGate.blockedMessage || 'Upload a Rent Roll or a T12 to generate.'"
          count = text.count(old_fallback)
          if count != 2:
              raise SystemExit(f'Dashboard fallback expected twice; found {count}')
          dashboard.write_text(text.replace(old_fallback, "reportUploadGate.blockedMessage || 'Upload both a Rent Roll and a T12 to generate.'"), encoding='utf-8')
          PY

      - name: Verify bounded diff and prohibited copy
        run: |
          git diff --check
          git diff -- src/lib/customerBoundarySupabase.js src/pages/Pricing.jsx src/pages/Dashboard.jsx
          ! grep -F "Start with a Rent Roll or T12" src/pages/Pricing.jsx
          ! grep -F "Supporting documents are optional" src/pages/Dashboard.jsx
          ! grep -F "Upload a Rent Roll or a T12 to generate" src/pages/Dashboard.jsx

      - name: Run focused strict-admission regressions
        run: |
          node tests/qa/report-upload-gate-smoke.js
          node tests/qa/phase1-admission-core-mode-contract-smoke.js
          node tests/qa/job-failure-messaging-smoke.js
          node tests/qa/launch-readiness-customer-journey-smoke.js

      - name: Commit bounded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/customerBoundarySupabase.js src/pages/Pricing.jsx src/pages/Dashboard.jsx
          git commit -m "Align customer journey with strict admission doctrine"
          git push origin HEAD:internal-underwriting-editorial-analytical-elite-20260906-r1
