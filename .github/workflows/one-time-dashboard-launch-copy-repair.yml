name: One-time Dashboard Launch Copy Repair

on:
  push:
    branches:
      - internal-underwriting-editorial-analytical-elite-20260906-r1
    paths:
      - '.github/workflows/one-time-dashboard-launch-copy-repair.yml'

permissions:
  contents: write

jobs:
  repair-dashboard-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: internal-underwriting-editorial-analytical-elite-20260906-r1
          fetch-depth: 0

      - name: Apply exact bounded replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/Dashboard.jsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "Upload your documents to generate an institutional underwriting report.",
                  "Upload property documents to generate a Screening or Underwriting Report.",
              ),
              (
                  "T12 + Rent Roll only",
                  "Start with a Rent Roll or T12; provide both when available.",
              ),
              (
                  "For initial investment review.",
                  "Fast screening for early deal triage and acquisition decisions.",
              ),
              (
                  "No charts. No projections.",
                  "Source gaps and inconsistencies are disclosed.",
              ),
              (
                  "T12 + Rent Roll + supporting due diligence documents",
                  "Start with a Rent Roll or T12; provide both when available.",
              ),
              (
                  "Full institutional underwriting report.",
                  "Add supporting due diligence to deepen analysis where relevant.",
              ),
              (
                  "Investment committee-ready depth.",
                  "Debt, refinance, and downside analysis appear where supported.",
              ),
              (
                  "1 Full Underwriting report",
                  "1 Underwriting report",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}; found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Verify bounded diff
        run: |
          git diff --check
          git diff -- src/pages/Dashboard.jsx

      - name: Run customer upload and failure regressions
        run: |
          node tests/qa/report-upload-gate-smoke.js
          node tests/qa/job-failure-messaging-smoke.js
          node tests/qa/launch-readiness-customer-journey-smoke.js

      - name: Commit bounded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx
          git commit -m "Align Dashboard launch copy with core admission truth"
          git push origin HEAD:internal-underwriting-editorial-analytical-elite-20260906-r1
