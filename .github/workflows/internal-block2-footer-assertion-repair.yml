name: InvestorIQ Internal Block 2 Legacy Document Smoke Repair

on:
  push:
    branches:
      - internal-final-surgical-polish-20260825

permissions:
  contents: write

jobs:
  repair-legacy-document-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply temporary migration scripts when present
        id: migrate
        shell: bash
        run: |
          if [ ! -f .github/internal-block2-legacy-smoke-repair.py ]; then
            echo "script_present=0" >> "$GITHUB_OUTPUT"
            echo "Temporary repair script not present; nothing to do."
            exit 0
          fi
          python .github/internal-block2-legacy-smoke-repair.py
          if [ -f .github/internal-block2-legacy-smoke-repair-post.py ]; then
            python .github/internal-block2-legacy-smoke-repair-post.py
          fi
          echo "script_present=1" >> "$GITHUB_OUTPUT"

      - name: Run complete legacy document smoke
        if: steps.migrate.outputs.script_present == '1'
        id: proof
        shell: bash
        run: |
          set +e
          node tests/qa/acquisition-memo-v2-document-smoke.js
          code=$?
          echo "proof_status=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit only when complete smoke is clean
        if: steps.migrate.outputs.script_present == '1' && steps.proof.outputs.proof_status == '0'
        shell: bash
        run: |
          git config user.name "rob01-web"
          git config user.email "robmccallum01@gmail.com"
          git add -- tests/qa/acquisition-memo-v2-document-smoke.js
          if git diff --cached --quiet; then
            echo "No document-smoke diff remains."
            exit 0
          fi
          git commit -m "align legacy document smoke with current report surface"
          git push origin HEAD:internal-final-surgical-polish-20260825
