name: InvestorIQ Internal Block 2 Footer Assertion Repair

on:
  push:
    branches:
      - internal-final-surgical-polish-20260825

permissions:
  contents: write

jobs:
  repair-footer-assertion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align stale footer assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/qa/acquisition-memo-v2-document-smoke.js')
          text = p.read_text(encoding='utf-8')
          old = 'assert.match(finalHtml, /CONFIDENTIAL - INVESTORIQ TECHNOLOGIES INC\\./i);'
          new = 'assert.match(finalHtml, /CONFIDENTIAL \\| INVESTORIQ TECHNOLOGIES INC\\./i);'
          if old not in text:
              raise SystemExit('stale footer assertion not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused footer proof without failure notification
        id: proof
        shell: bash
        run: |
          set +e
          node tests/qa/acquisition-memo-v2-document-smoke.js
          code=$?
          if [ $code -eq 0 ]; then
            echo "proof_status=0" >> "$GITHUB_OUTPUT"
          else
            echo "proof_status=1" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit only when focused proof is clean
        if: steps.proof.outputs.proof_status == '0'
        shell: bash
        run: |
          git config user.name "rob01-web"
          git config user.email "robmccallum01@gmail.com"
          git add -- tests/qa/acquisition-memo-v2-document-smoke.js
          if git diff --cached --quiet; then
            echo "No footer assertion diff remains."
            exit 0
          fi
          git commit -m "align document smoke with current footer contract"
          git push origin HEAD:internal-final-surgical-polish-20260825
