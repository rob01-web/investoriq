name: InvestorIQ Phase 8 Screening Methodology Pagination Repair

on:
  push:
    branches:
      - internal-phase8-elite-customer-facing-visual-authority-20260902
    paths:
      - 'scripts/phase8-repair-screening-methodology-pagination.mjs'
      - '.github/workflows/phase8-screening-methodology-pagination-repair.yml'

permissions:
  contents: write

jobs:
  repair-certify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Phase 8 branch
        uses: actions/checkout@v4
        with:
          ref: internal-phase8-elite-customer-facing-visual-authority-20260902
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply Screening methodology pagination repair
        run: |
          node --check scripts/phase8-repair-screening-methodology-pagination.mjs
          node scripts/phase8-repair-screening-methodology-pagination.mjs
          node --check api/_lib/phase8-customer-facing-visual-authority.js

      - name: Install locked dependencies
        run: npm ci

      - name: Run Phase 8 and sealed-lane authority
        run: |
          node tests/qa/phase8-source-reconciliation-authority-smoke.js
          node tests/qa/phase8-customer-facing-visual-authority-smoke.js
          node tests/qa/screening-report-sealed-lane-authority-smoke.js
          node tests/qa/screening-report-smoke.js
          node tests/qa/full-underwriting-final-surgical-polish-smoke.js
          node tests/qa/phase7-elite-report-design-contract-smoke.js
          node tests/qa/phase7-decision-support-smoke.js

      - name: Run production build
        run: npm run build

      - name: Generate real current-branch artifacts
        env:
          PHASE7_ARTIFACT_DIR: phase8-pagination-artifacts
        run: node scripts/phase7-generate-visual-artifacts.js

      - name: Validate real Phase 8 customer artifacts
        env:
          PHASE8_ARTIFACT_DIR: phase8-pagination-artifacts
        run: node scripts/phase8-validate-visual-artifacts.js

      - name: Render candidate PDFs in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          for html in \
            phase8-pagination-artifacts/phase7-screening-harbourstone.html \
            phase8-pagination-artifacts/phase7-underwriting-stonebridge.html; do
            pdf="${html%.html}.pdf"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --print-to-pdf="$pdf" "file://$(realpath "$html")"
            test -s "$pdf"
          done

      - name: Record candidate hashes
        shell: bash
        run: |
          set -euo pipefail
          (cd phase8-pagination-artifacts && sha256sum phase7-screening-harbourstone.html phase7-screening-harbourstone.pdf phase7-underwriting-stonebridge.html phase7-underwriting-stonebridge.pdf phase8-visual-authority-manifest.json > phase8-pagination-sha256.txt)
          cat phase8-pagination-artifacts/phase8-pagination-sha256.txt

      - name: Diff safety
        run: |
          git diff --check
          git status --short

      - name: Commit product repair only after automated certification passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "investoriq-phase8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- api/_lib/phase8-customer-facing-visual-authority.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product change to commit."
          else
            git commit -m "Phase 8: eliminate orphaned Screening methodology page"
            git push origin HEAD:internal-phase8-elite-customer-facing-visual-authority-20260902
          fi

      - name: Upload pagination certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase8-screening-pagination-candidate-${{ github.sha }}
          path: |
            phase8-pagination-artifacts/phase7-screening-harbourstone.html
            phase8-pagination-artifacts/phase7-screening-harbourstone.pdf
            phase8-pagination-artifacts/phase7-underwriting-stonebridge.html
            phase8-pagination-artifacts/phase7-underwriting-stonebridge.pdf
            phase8-pagination-artifacts/phase8-visual-authority-manifest.json
            phase8-pagination-artifacts/phase8-pagination-sha256.txt
          if-no-files-found: error
          retention-days: 14
