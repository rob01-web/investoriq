name: TEMP Visual ELITE Prince Typography + Section Atomicity

on:
  push:
    branches:
      - internal-visual-elite-step6-typography-parity-20260906-r1

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal-visual-elite-step6-typography-parity-20260906-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply Prince typography parity and short-section atomicity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/_lib/investoriq-visual-elite-css.js')
          s = p.read_text()
          marker = "  line-height:1.43;\n}\n\n/* Shared cover identity"
          replacement = "  line-height:1.43;\n  font-variant-numeric:normal !important;\n}\n.iq-phase8b * { font-variant-numeric:normal !important; }\n\n/* Shared cover identity"
          if marker not in s:
              raise SystemExit('Visual ELITE root close marker missing')
          s = s.replace(marker, replacement, 1)
          old_section = ".iq-phase8b .section { background:#fff !important; }"
          new_section = ".iq-phase8b .section {\n  background:#fff !important;\n  break-inside:avoid-page !important;\n  page-break-inside:avoid !important;\n}"
          if old_section not in s:
              raise SystemExit('section atomicity marker missing')
          s = s.replace(old_section, new_section, 1)
          old_table = ".iq-phase8b table { border-collapse:collapse !important; }"
          new_table = ".iq-phase8b table { border-collapse:collapse !important; font-variant-numeric:normal !important; }"
          if old_table not in s:
              raise SystemExit('table marker missing')
          s = s.replace(old_table, new_table, 1)
          p.write_text(s)
          PY
      - name: Add permanent Prince typography regression guard
        shell: bash
        run: |
          cat > tests/qa/investoriq-visual-elite-prince-typography-smoke.js <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const visualCss = fs.readFileSync("api/_lib/investoriq-visual-elite-css.js", "utf8");
          const parityCss = fs.readFileSync("api/_lib/investoriq-publication-parity-css.js", "utf8");
          const baseCss = fs.readFileSync("api/_lib/investoriq-publication-base-css.js", "utf8");
          assert.match(baseCss, /font-variant-numeric:tabular-nums/,
            "Regression fixture must continue to prove the upstream broad tabular-numeric source exists.");
          assert.match(visualCss, /\.iq-phase8b \*[^{]*\{[^}]*font-variant-numeric:normal !important;/,
            "Visual ELITE must reset numeric OpenType features for all proportional publication descendants.");
          assert.match(visualCss, /\.iq-phase8b table \{[^}]*font-variant-numeric:normal !important;/,
            "Whole tables must not inherit Prince tabular-space substitution.");
          assert.ok(parityCss.includes("INVESTORIQ_VISUAL_ELITE_CSS"),
            "Shared parity CSS must continue to append the Visual ELITE override layer.");
          assert.match(visualCss, /\.iq-phase8b \.section \{[\s\S]*?break-inside:avoid-page !important;[\s\S]*?page-break-inside:avoid !important;/,
            "Short publication sections must remain atomic when they fit on one page.");
          console.log("investoriq-visual-elite-prince-typography-smoke: PASS");
          EOF
      - name: Run Visual ELITE guards
        shell: bash
        run: |
          set -e
          for f in tests/qa/investoriq-visual-elite-*.js; do
            echo "=== $f ==="
            node "$f"
          done
      - name: Production build
        run: npm run build
      - name: Generate exact Stonebridge dual-lane HTML
        run: node scripts/visual-elite-step6-dual-lane-html.mjs
      - name: Render exact candidate with Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          for html in step6-pagination-preview/Stonebridge_screening.html step6-pagination-preview/Stonebridge_underwriting.html; do
            pdf="${html%.html}.pdf"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --print-to-pdf="$pdf" "file://$(realpath "$html")"
            test -s "$pdf"
          done
      - name: Record page counts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import pdfParse from 'pdf-parse';
          for (const lane of ['screening','underwriting']) {
            const p = `step6-pagination-preview/Stonebridge_${lane}.pdf`;
            const parsed = await pdfParse(fs.readFileSync(p));
            console.log(`${lane}: pages=${parsed.numpages}`);
          }
          NODE
      - name: Diff safety
        run: git diff --check
      - name: Commit bounded source repair
        shell: bash
        run: |
          git config user.name 'investoriq-visual-elite-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/_lib/investoriq-visual-elite-css.js tests/qa/investoriq-visual-elite-prince-typography-smoke.js
          git diff --cached --check
          git commit -m 'Visual ELITE Step 6: repair Prince typography spacing and section flow'
          git push origin HEAD:internal-visual-elite-step6-typography-parity-20260906-r1
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-elite-prince-typography-preview-${{ github.run_id }}
          path: |
            step6-pagination-preview/Stonebridge_screening.pdf
            step6-pagination-preview/Stonebridge_underwriting.pdf
          if-no-files-found: error
          retention-days: 7
