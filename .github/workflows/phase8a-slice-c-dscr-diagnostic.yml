name: InvestorIQ Phase 8A Slice C DSCR Diagnostic

on:
  push:
    branches:
      - internal-phase8a-owner-acceptance-recovery-20260903-r1
    paths:
      - 'scripts/phase8a-diagnose-stonebridge-financial-intelligence.mjs'
      - '.github/workflows/phase8a-slice-c-dscr-diagnostic.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal-phase8a-owner-acceptance-recovery-20260903-r1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply current Slice C patches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/phase8a-slice-c-decision-patch-normalize.mjs
          node scripts/phase8a-slice-c-patch.mjs
          node scripts/phase8a-slice-c-decision-snapshot-patch.mjs
          node scripts/phase8a-slice-c-test-alignment-patch.mjs
          node scripts/phase8a-slice-c-decision-support-compat-patch.mjs
          node scripts/phase8a-slice-c-closed-slice-compat-patch.mjs
          node scripts/phase8a-slice-c-operating-cushion-compat-patch.mjs
          node scripts/phase8a-slice-c-dscr-display-compat-patch.mjs
      - name: Install dependencies
        run: npm ci
      - name: Inspect exact Stonebridge financial intelligence
        run: node scripts/phase8a-diagnose-stonebridge-financial-intelligence.mjs
      - name: Generate patched exact handler artifacts
        env:
          PHASE7_ARTIFACT_DIR: phase8a-dscr-diagnostic-artifacts
        run: node scripts/phase7-generate-visual-artifacts.js
      - name: Print DSCR surface evidence
        shell: bash
        run: |
          set -euo pipefail
          HTML=phase8a-dscr-diagnostic-artifacts/phase7-underwriting-stonebridge.html
          echo '=== raw DSCR markup ==='
          grep -io -C 3 -E '.{0,180}(Current DSCR|Proposed DSCR|DSCR from|modeled DSCR).{0,220}' "$HTML" || true
          echo '=== visible text around DSCR ==='
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('phase8a-dscr-diagnostic-artifacts/phase7-underwriting-stonebridge.html','utf8');
          const text = html.replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ').replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&#39;/gi,"'").replace(/&quot;/gi,'"').replace(/\s+/g,' ').trim();
          for (const token of ['Current DSCR','Proposed DSCR','tightens DSCR','modeled DSCR']) {
            const i = text.indexOf(token);
            console.log(token, i >= 0 ? text.slice(Math.max(0,i-220), i+520) : 'MISSING');
          }
          NODE
      - name: Print Chapter 1 metric wiring source
        shell: bash
        run: |
          set -euo pipefail
          grep -n -C 8 -E 'currentDebtDscr|proposedFinancingDscr|metricFromCalculationReceipt|financialIntelligenceAccepted' api/_lib/full-underwriting-chapter1-elite-contract.js | head -n 700
