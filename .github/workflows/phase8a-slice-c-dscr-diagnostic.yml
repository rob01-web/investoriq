name: InvestorIQ Phase 8A Slice C DSCR Diagnostic

on:
  push:
    branches:
      - internal-phase8a-owner-acceptance-recovery-20260903-r1
    paths:
      - '.github/workflows/phase8a-slice-c-dscr-diagnostic.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal-phase8a-owner-acceptance-recovery-20260903-r1
          fetch-depth: 1
      - name: Locate DSCR text transformations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PHASE8A_DIAGNOSTICS
          {
            echo '=== FILES WITH DSCR AND replace/sanitize/strip/remove ==='
            grep -R -n -I -E 'DSCR|dscr' api scripts tests 2>/dev/null | grep -E 'replace|sanitize|strip|remove|customer|copy' | head -n 600 || true
            echo
            echo '=== LITERAL DSCR REPLACEMENT CANDIDATES ==='
            grep -R -n -I -E 'replace\([^\n]*DSCR|DSCR[^\n]*replace|replace\([^\n]*dscr|dscr[^\n]*replace' api scripts 2>/dev/null | head -n 600 || true
            echo
            echo '=== WHOLE WORD FILTERS / BANNED TOKEN TABLES ==='
            grep -R -n -I -E 'banned|forbidden|internal|sanitize|customerFacing|customer_copy|customerCopy|humanize|polish' api/_lib scripts 2>/dev/null | grep -E 'DSCR|dscr|replace|token|phrase|word' | head -n 800 || true
          } > PHASE8A_DIAGNOSTICS/dscr-removal-candidates.txt
          git config user.name "investoriq-phase8a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add PHASE8A_DIAGNOSTICS/dscr-removal-candidates.txt
          if ! git diff --cached --quiet; then
            git commit -m "Phase 8A diagnostic: locate DSCR removal authority"
            git push origin HEAD:internal-phase8a-owner-acceptance-recovery-20260903-r1
          fi
