name: InvestorIQ Phase 8A Slice C Valuation Diagnostic

on:
  push:
    branches:
      - internal-phase8a-owner-acceptance-recovery-20260903-r1
    paths:
      - '.github/workflows/phase8a-slice-c-dscr-diagnostic.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal-phase8a-owner-acceptance-recovery-20260903-r1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply current Slice C patches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/phase8a-slice-c-decision-patch-normalize.mjs
          node scripts/phase8a-slice-c-patch.mjs
          node scripts/phase8a-slice-c-decision-snapshot-patch.mjs
          node scripts/phase8a-slice-c-test-alignment-patch.mjs
          node scripts/phase8a-slice-c-decision-support-compat-patch.mjs
          node scripts/phase8a-slice-c-closed-slice-compat-patch.mjs
          node scripts/phase8a-slice-c-operating-cushion-compat-patch.mjs
          node scripts/phase8a-slice-c-dscr-display-compat-patch.mjs
          node scripts/phase8a-slice-c-source-bound-dscr-fallback-patch.mjs
          node scripts/phase8a-slice-c-hold-dscr-authority-patch.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate exact source-bound handler artifacts
        env:
          PHASE7_ARTIFACT_DIR: phase8a-valuation-diagnostic-artifacts
        run: node scripts/phase7-generate-visual-artifacts.js
      - name: Persist stale valuation surface evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PHASE8A_DIAGNOSTICS
          OUT=PHASE8A_DIAGNOSTICS/valuation-label-surface.txt
          HTML=phase8a-valuation-diagnostic-artifacts/phase7-underwriting-stonebridge.html
          {
            echo '=== SOURCE TREE EXACT PHRASE ==='
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='*.md' --exclude='*.txt' -F 'InvestorIQ Implied Value' api scripts tests || true
            echo
            echo '=== SOURCE TREE IMPLIED VALUE LABELS ==='
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='*.md' --exclude='*.txt' -E 'Implied Value|Cap-Rate Cross-Check|Cap.Rate Cross.Check' api scripts tests | head -n 300 || true
            echo
            echo '=== FINAL ARTIFACT RAW WINDOWS ==='
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('phase8a-valuation-diagnostic-artifacts/phase7-underwriting-stonebridge.html','utf8');
          const text = html.replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ').replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&#39;/gi,"'").replace(/&quot;/gi,'"').replace(/\s+/g,' ').trim();
          for (const token of ['InvestorIQ Implied Value','Implied Value Per Unit','InvestorIQ Implied Value Less Purchase Price','NOI / Cap-Rate Cross-Check','NOI / Cap-Rate Cross-Check Value']) {
            console.log(`TOKEN=${token}`);
            let from = 0, count = 0;
            while (count < 12) {
              const i = text.toLowerCase().indexOf(token.toLowerCase(), from);
              if (i < 0) break;
              console.log(`[VISIBLE ${count}] ${text.slice(Math.max(0,i-300), i+700)}`);
              from = i + token.length;
              count++;
            }
            if (!count) console.log('VISIBLE MISSING');
            from = 0; count = 0;
            while (count < 12) {
              const i = html.toLowerCase().indexOf(token.toLowerCase(), from);
              if (i < 0) break;
              console.log(`[RAW ${count}] ${html.slice(Math.max(0,i-500), i+850)}`);
              from = i + token.length;
              count++;
            }
            if (!count) console.log('RAW MISSING');
            console.log('');
          }
          NODE
          } > "$OUT"
          git config user.name "investoriq-phase8a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m "Phase 8A diagnostic: capture stale implied-value surface"
            git push origin HEAD:internal-phase8a-owner-acceptance-recovery-20260903-r1
          fi
