name: One-time Owner Economics Admin Wiring

on:
  push:
    branches:
      - internal-owner-economics-admin-20260909-r1

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: internal-owner-economics-admin-20260909-r1
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wire owner economics into Admin Dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/AdminDashboard.jsx')
          text = path.read_text()

          replacements = [
              (
                  'import QualityIncidentDashboard from "@/components/Admin/QualityIncidentDashboard.jsx";\n',
                  'import QualityIncidentDashboard from "@/components/Admin/QualityIncidentDashboard.jsx";\nimport OwnerEconomicsPanel from "@/components/Admin/OwnerEconomicsPanel.jsx";\n'
              ),
              (
                  '      let revMTD = null;\n      if (adminRunKey.trim()) {\n',
                  '      let revMTD = null;\n      let settledCheckoutCount = null;\n      if (adminRunKey.trim()) {\n'
              ),
              (
                  "          revMTD = Number(commercePayload.commerce_summary.settled_revenue_minor || 0);\n",
                  "          revMTD = Number(commercePayload.commerce_summary.settled_revenue_minor || 0);\n          settledCheckoutCount = Number(commercePayload.commerce_summary.settled_checkout_count || 0);\n"
              ),
              (
                  '      setCmdStats({ revMTD, rptToday: rptToday || 0, totalUsers: totalUsers || 0, openIssues: openIssues || 0, stuckCount: (stuck || []).length });\n',
                  '      setCmdStats({ revMTD, settledCheckoutCount, rptToday: rptToday || 0, totalUsers: totalUsers || 0, openIssues: openIssues || 0, stuckCount: (stuck || []).length });\n'
              ),
              (
                  '          <SystemHealthBanner snapshot={systemHealthSnapshot} />\n\n          <QualityIncidentDashboard adminRunKey={adminRunKey} />\n',
                  '          <SystemHealthBanner snapshot={systemHealthSnapshot} />\n\n          <OwnerEconomicsPanel\n            actualRevenueMinor={cmdStats?.revMTD}\n            actualCheckoutCount={cmdStats?.settledCheckoutCount}\n          />\n\n          <QualityIncidentDashboard adminRunKey={adminRunKey} />\n'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Admin wiring guard failed ({count}): {old[:120]!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Verify exact bounded diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected='src/pages/AdminDashboard.jsx'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Run owner economics calculation smoke
        run: node tests/qa/owner-economics-smoke.js

      - name: Run canonical launch QA
        run: npm run qa

      - name: Build production bundle
        run: npm run build

      - name: Commit admin wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.jsx
          git commit -m "Wire owner economics into admin dashboard"
          git push origin HEAD:internal-owner-economics-admin-20260909-r1
