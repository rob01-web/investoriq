name: InvestorIQ Phase 8 ELITE Customer-Facing Certification

# Permanent Phase 8 authority wall: source-bound HTML, Chrome PDF, hashes, artifacts.
# Final clean certification wall: temporary repair machinery removed.
on:
  push:
    branches:
      - internal-phase8-elite-customer-facing-visual-authority-20260902
    paths:
      - 'api/_lib/report-surface-contracts.js'
      - 'api/_lib/phase8-customer-facing-visual-authority.js'
      - 'api/_lib/screening-report-pipeline.js'
      - 'api/_lib/full-underwriting-final-surgical-polish.js'
      - 'api/_lib/acquisition-memo-v2-orchestrator.js'
      - 'tests/qa/generate-client-report-rent-roll-smoke.js'
      - 'tests/qa/phase8-source-reconciliation-authority-smoke.js'
      - 'tests/qa/phase8-customer-facing-visual-authority-smoke.js'
      - 'scripts/phase7-generate-visual-artifacts.js'
      - 'scripts/phase8-artifact-identity-fingerprint.js'
      - 'scripts/phase8-visual-certification-fixtures.js'
      - 'scripts/phase8-validate-visual-artifacts.js'
      - 'scripts/phase8-validate-rendered-pdfs.js'
      - 'tests/qa/phase8-artifact-identity-fingerprint-smoke.js'
      - '.github/workflows/phase8-elite-customer-facing-certification.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: investoriq-phase8-elite-customer-facing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-real-customer-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Phase 8 branch
        uses: actions/checkout@v4
        with:
          ref: internal-phase8-elite-customer-facing-visual-authority-20260902

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Phase 8 reconciliation authority
        run: node tests/qa/phase8-source-reconciliation-authority-smoke.js

      - name: Run Phase 8 customer-facing authority
        run: node tests/qa/phase8-customer-facing-visual-authority-smoke.js

      - name: Run Phase 8 artifact identity authority
        run: node tests/qa/phase8-artifact-identity-fingerprint-smoke.js

      - name: Run Screening sealed-lane regressions
        run: |
          node tests/qa/screening-report-sealed-lane-authority-smoke.js
          node tests/qa/screening-report-smoke.js

      - name: Run Underwriting final-polish regression
        run: node tests/qa/full-underwriting-final-surgical-polish-smoke.js

      - name: Run Phase 7 design regressions
        run: |
          node tests/qa/phase7-elite-report-design-contract-smoke.js
          node tests/qa/phase7-decision-support-smoke.js

      - name: Run production build
        run: npm run build

      - name: Generate authoritative current-branch HTML artifacts
        env:
          PHASE7_ARTIFACT_DIR: phase8-artifacts
        run: node scripts/phase7-generate-visual-artifacts.js

      - name: Validate Phase 8 customer-facing HTML authority
        env:
          PHASE8_ARTIFACT_DIR: phase8-artifacts
        run: node scripts/phase8-validate-visual-artifacts.js

      - name: Render authoritative PDFs in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is unavailable on the certification runner." >&2
            exit 1
          fi
          echo "Using browser: $CHROME"
          for html in \
            phase8-artifacts/phase7-screening-harbourstone.html \
            phase8-artifacts/phase7-underwriting-stonebridge.html; do
            test -s "$html"
            pdf="${html%.html}.pdf"
            "$CHROME" \
              --headless \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --no-pdf-header-footer \
              --print-to-pdf="$pdf" \
              "file://$(realpath "$html")"
            test -s "$pdf"
          done
          ls -lh phase8-artifacts

      - name: Validate rendered PDF identities and core facts
        env:
          PHASE8_ARTIFACT_DIR: phase8-artifacts
        run: node scripts/phase8-validate-rendered-pdfs.js

      - name: Record artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          (
            cd phase8-artifacts
            sha256sum \
              phase7-screening-harbourstone.html \
              phase7-screening-harbourstone.pdf \
              phase7-underwriting-stonebridge.html \
              phase7-underwriting-stonebridge.pdf \
              phase8-visual-authority-manifest.json \
              > phase8-artifact-sha256.txt
          )
          cat phase8-artifacts/phase8-artifact-sha256.txt

      - name: Upload Phase 8 visual certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase8-elite-customer-facing-certification-${{ github.sha }}
          path: |
            phase8-artifacts/phase7-screening-harbourstone.html
            phase8-artifacts/phase7-screening-harbourstone.pdf
            phase8-artifacts/phase7-underwriting-stonebridge.html
            phase8-artifacts/phase7-underwriting-stonebridge.pdf
            phase8-artifacts/phase7-visual-artifact-manifest.json
            phase8-artifacts/phase8-visual-authority-manifest.json
            phase8-artifacts/phase8-artifact-sha256.txt
          if-no-files-found: error
          retention-days: 14
