name: InvestorIQ Phase 8 Final Cleanup

on:
  push:
    branches:
      - internal-phase8-elite-customer-facing-visual-authority-20260902
    paths:
      - '.github/workflows/phase8-final-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Phase 8 branch
        uses: actions/checkout@v4
        with:
          ref: internal-phase8-elite-customer-facing-visual-authority-20260902
          fetch-depth: 0

      - name: Verify permanent Phase 8 authority survives cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/phase8-elite-customer-facing-certification.yml
          test -s scripts/phase8-validate-visual-artifacts.js
          test -s api/_lib/phase8-customer-facing-visual-authority.js
          test -s tests/qa/phase8-source-reconciliation-authority-smoke.js
          test -s tests/qa/phase8-customer-facing-visual-authority-smoke.js

      - name: Remove temporary Phase 8 repair machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/phase8-bootstrap-repair.yml \
            .github/workflows/phase8-guarded-repair.yml \
            .github/workflows/phase8-screening-evidence-anchor-repair.yml \
            .github/workflows/phase8-screening-methodology-pagination-repair.yml \
            .github/workflows/phase8-screening-visual-fixture-upgrade.yml \
            scripts/phase8-apply-repair.mjs \
            scripts/phase8-apply-repair-v2.mjs \
            scripts/phase8-apply-repair-v3.mjs \
            scripts/phase8-apply-repair-v4.mjs \
            scripts/phase8-apply-repair-v5.mjs \
            scripts/phase8-apply-repair-v6.mjs \
            scripts/phase8-apply-repair-v7.mjs \
            scripts/phase8-bootstrap-repair.mjs \
            scripts/phase8-repair-screening-evidence-anchor.mjs \
            scripts/phase8-repair-screening-methodology-pagination.mjs \
            scripts/phase8-upgrade-screening-visual-fixture.mjs \
            .github/workflows/phase8-final-cleanup.yml
          git diff --check
          git status --short

      - name: Commit clean Phase 8 certification surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "investoriq-phase8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Phase 8: remove temporary repair machinery"
          git push origin HEAD:internal-phase8-elite-customer-facing-visual-authority-20260902
