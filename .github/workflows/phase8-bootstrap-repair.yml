name: InvestorIQ Phase 8 Guarded Repair Bootstrap

on:
  push:
    branches:
      - internal-phase8-elite-customer-facing-visual-authority-20260902
    paths:
      - 'scripts/phase8-bootstrap-repair.mjs'
      - '.github/workflows/phase8-bootstrap-repair.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: investoriq-phase8-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Phase 8 branch
        uses: actions/checkout@v4
        with:
          ref: internal-phase8-elite-customer-facing-visual-authority-20260902
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply guarded Phase 8 repair
        run: node scripts/phase8-bootstrap-repair.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Focused Phase 8 authority tests
        run: |
          node tests/qa/phase8-source-reconciliation-authority-smoke.js
          node tests/qa/phase8-customer-facing-visual-authority-smoke.js
          node tests/qa/screening-report-sealed-lane-authority-smoke.js
          node tests/qa/full-underwriting-final-surgical-polish-smoke.js

      - name: Production build
        run: npm run build

      - name: Diff safety
        run: |
          git diff --check
          git status --short

      - name: Commit guarded repair only after green tests
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No Phase 8 repair changes to commit."
            exit 0
          fi
          git config user.name "investoriq-phase8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            api/_lib/report-surface-contracts.js \
            api/_lib/phase8-customer-facing-visual-authority.js \
            api/_lib/screening-report-pipeline.js \
            api/_lib/full-underwriting-final-surgical-polish.js \
            api/_lib/acquisition-memo-v2-orchestrator.js \
            tests/qa/generate-client-report-rent-roll-smoke.js \
            tests/qa/phase8-source-reconciliation-authority-smoke.js \
            tests/qa/phase8-customer-facing-visual-authority-smoke.js \
            scripts/phase8-validate-visual-artifacts.js \
            .github/workflows/phase8-elite-customer-facing-certification.yml
          git diff --cached --check
          git commit -m "Phase 8: strengthen customer-facing report authority"
          git push origin HEAD:internal-phase8-elite-customer-facing-visual-authority-20260902
